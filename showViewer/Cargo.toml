[package]
name = "showViewer"
description = "a simple vj loop renderer"
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/HugoBrisebois/pre-show-scene-viewer"

[dependencies]
eframe = { version = "0.36.2", features = ["glow"] }
egui = "0.36.2"
ffmpeg-next = "9.0.0"
realfft = "3.5.0"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
rfd = "0.17.2"
